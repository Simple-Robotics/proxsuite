[workspace]
name = "proxsuite"
version = "0.7.2"
description = "The Advanced Proximal Optimization Toolbox"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
ccache = ">=4.9.1"
cmake = ">=3.22"
cxx-compiler = ">=1.7.0"
ninja = ">=1.11"
eigen = ">=3.4.0,<4"
simde = ">=0.8.2,<0.9"
python = ">=3.8, <3.13"     # for python bindings
python_abi = ">=3.8, <3.13" # for python bindings
numpy = ">=1.24.0,<2.4"     # for python bindings
nanobind = ">=2.9.2,<3"     # for python bindings
catch2 = ">=3.8.0,<4"       # for test
cereal = ">=1.3.2,<2"       # for test
libmatio = ">=1.2.0,<2"     # for test (maros meszaros)
scipy = ">=1.16.3,<2"       # for test
doxygen = ">=1.13.2,<2"     # for doc
graphviz = ">=10.0.0,<14"   # for doc
prek = ">=0.2.21,<0.3"      # for linting

[activation.env]
# Setup ccache
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"
# Create compile_commands.json for language server
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"
# Activate color output with Ninja
CMAKE_COLOR_DIAGNOSTICS = "ON"
# Help ccache manage generated files and PCH (https://ccache.dev/manual/latest.html#_precompiled_headers)
CCACHE_SLOPPINESS = "include_file_ctime,include_file_mtime,pch_defines,time_macros"

[tasks.configure]
cmd = [
  "cmake",
  "-S",
  ".",
  "-B",
  "build",
  "-G",
  "Ninja",
  "-DJRL_CMAKEMODULES_SOURCE_DIR=$JRL_CMAKEMODULES_SOURCE_DIR",
  "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
  "-DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE",
  "-DPROXSUITE_CXX_STANDARD=$PROXSUITE_CXX_STANDARD",
  "-DBUILD_WITH_VECTORIZATION_SUPPORT=ON",
  "-DBUILD_WITH_SERIALIZATION=ON",
  "-DBUILD_MAROS_MESZAROS_TESTS=OFF",
  "-DENABLE_WARNINGS=OFF",
  "-DENABLE_WARNINGS_AS_ERRORS=OFF",
  "-DBUILD_TESTING=ON",
  "-DBUILD_DOCUMENTATION=ON",
  "-DBUILD_EXAMPLES=ON",
  "-DBUILD_BENCHMARKS=ON",
  "-DBUILD_PYTHON_INTERFACE=ON",
  "-DGENERATE_PYTHON_STUBS=ON",
  "-DBUILD_WITH_OPENMP_SUPPORT=ON",
  "-DBUILD_BINDINGS_WITH_AVX2_SUPPORT=ON",
  "-DBUILD_BINDINGS_WITH_AVX512_SUPPORT=ON",
]

[tasks.reconfigure]
depends-on = ["clear", "configure"]

[tasks.build]
depends-on = ["configure"]
cmd = ["cmake", "--build", "build"]

[tasks.test]
depends-on = ["build"]
cmd = ["ctest", "--test-dir", "build", "--output-on-failure"]

[tasks.test-import-python]
depends-on = ["install"]
cmd = [
  "python",
  "-c",
  "import proxsuite; print(proxsuite.helpers.printVersion())",
]

[tasks.install]
depends-on = ["build"]
cmd = ["cmake", "--install", "build"]

[tasks.uninstall]
depends-on = ["install"]
cmd = ["cmake", "--build", "build", "--target", "uninstall"]

[tasks.doc]
depends-on = ["configure"]
cmd = ["cmake", "--build", "build", "--target", "doc"]

[tasks.clear]
cmd = ["cmake", "-E", "remove_directory", "build"]

[tasks.clean]
depends-on = ["configure"]
cmd = ["cmake", "--build", "build", "--target", "clean"]

[tasks.lint]
cmd = ["prek", "run", "-a"]

[tasks._test-packaging-configure]
depends-on = ["install"]
cmd = [
  "cmake",
  "-G",
  "Ninja",
  "-S",
  "test/packaging/cmake",
  "-B",
  "build/test-packaging",
  "--log-level=DEBUG",
]

[tasks.test-packaging]
depends-on = ["_test-packaging-configure"]
cmd = ["cmake", "--build", "build/test-packaging", "--verbose"]

[tasks._test-packaging-components-configure]
depends-on = ["install"]
cmd = [
  "cmake",
  "-G",
  "Ninja",
  "-S",
  "test/packaging/cmake-components",
  "-B",
  "build/test-packaging-components",
  "--log-level=DEBUG",
]

[tasks.test-packaging-components]
depends-on = ["_test-packaging-components-configure"]
cmd = ["cmake", "--build", "build/test-packaging-components", "--verbose"]

[tasks._test-packaging-fetchcontent-configure]
cmd = [
  "cmake",
  "-G",
  "Ninja",
  "-S",
  "test/packaging/fetchcontent",
  "-B",
  "build/test-packaging-fetchcontent",
  "-DPROXSUITE_FETCHCONTENT_SOURCE_DIR=$PIXI_PROJECT_ROOT",
  "--log-level=DEBUG",
]

[tasks.test-packaging-fetchcontent]
depends-on = ["_test-packaging-fetchcontent-configure"]
cmd = ["cmake", "--build", "build/test-packaging-fetchcontent", "--verbose"]

[feature.cpp20.activation.env]
PROXSUITE_CXX_STANDARD = "20"

[feature.cpp23.activation.env]
PROXSUITE_CXX_STANDARD = "23"

[environments]
cpp20 = ["cpp20"]
cpp23 = ["cpp23"]
