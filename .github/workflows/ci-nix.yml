name: CI - Nix

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.sources }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sources:
              - 'benchmark/**'
              - 'bindings/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'doc/**'
              - 'examples/**'
              - 'include/**'
              - 'package.xml'
              - 'test/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci-nix.yml'

  nix:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]
        extends: ["", "pkgs-eigen5"]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: gepetto
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check -L
      - run: nix build -L ".#${{ matrix.extends }}"

  check:
    if: always()
    name: check-macos-linux-nix

    needs:
      - changes
      - nix

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: nix
