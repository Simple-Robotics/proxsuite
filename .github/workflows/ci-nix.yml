name: CI - Nix

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

jobs:
  # Heavy jobs run only if a file that affects the build changes. Other paths are skipped.
  filter-paths:
    runs-on: ubuntu-latest
    outputs:
      run-jobs: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/workflows/paths-filter/paths-filter.yml

  nix:
    needs: filter-paths
    if: needs.filter-paths.outputs.run-jobs == 'true'
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]
        extends: ["", "pkgs-eigen5"]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: gepetto
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check -L
      - run: nix build -L ".#${{ matrix.extends }}"

  # Reports success if the other jobs succeeded.
  # The nix job may be skipped when the filter-paths job finds no relevant file (paths that do not need CI).
  check:
    if: always()
    name: check-macos-linux-nix

    needs:
      - filter-paths
      - nix

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: nix
